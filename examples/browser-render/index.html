<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client-side LBX preview</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202124; color: #eee; }
    main { width: min(900px, calc(100vw - 32px)); display: grid; gap: 16px; justify-items: center; }
    #drop { border: 2px dashed #777; border-radius: 10px; padding: 28px 44px; text-align: center; cursor: pointer; }
    #drop.hover { border-color: #6caeff; background: #292a2d; }
    #status { min-height: 1.25em; font-size: 14px; }
    #status.error { color: #ff9292; }
    #result { display: none; max-width: 100%; padding: 12px; overflow: auto; border-radius: 5px; background: #fff; box-shadow: 0 8px 30px #0008; }
    #result svg { display: block; max-width: 100%; max-height: 70vh; }
    input { display: none; }
  </style>
</head>
<body>
  <main>
    <label id="drop" for="file">
      Drop an .lbx file here, or click to choose one
      <input id="file" type="file" accept=".lbx">
    </label>
    <div id="status">The label stays in your browser.</div>
    <div id="result"></div>
  </main>

  <script type="module">
    // This example is served from the repository root, so use a native-browser-compatible URL.
    // Application code processed by Vite/Webpack/etc. can use the package specifier instead.
    import { renderLbxToSvg } from '../../dist/browser.js';

    const drop = document.querySelector('#drop');
    const fileInput = document.querySelector('#file');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');

    async function render(file) {
      status.classList.remove('error');
      status.textContent = `Rendering ${file.name}…`;
      result.style.display = 'none';
      try {
        result.innerHTML = renderLbxToSvg(await file.arrayBuffer());
        result.style.display = 'block';
        status.textContent = file.name;
      } catch (error) {
        status.classList.add('error');
        status.textContent = `Error: ${error instanceof Error ? error.message : String(error)}`;
      }
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files?.[0]) void render(fileInput.files[0]);
    });

    for (const type of ['dragover', 'dragleave', 'drop']) {
      drop.addEventListener(type, (event) => {
        event.preventDefault();
        drop.classList.toggle('hover', type === 'dragover');
      });
    }
    drop.addEventListener('drop', (event) => {
      const file = event.dataTransfer?.files[0];
      if (file) void render(file);
    });
  </script>
</body>
</html>
